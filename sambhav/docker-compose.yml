version: '3.8'

services:
  sambhav-ctf:
    build: .
    container_name: sambhav-security-lab
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      # Mount uploads directory for persistence
      - ./uploads:/app/uploads
      # Mount database for persistence
      - ./vulnerable_ctf.db:/app/vulnerable_ctf.db
    restart: unless-stopped
    networks:
      - sambhav-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  sambhav-network:
    driver: bridge

# Optional: Add volume for persistence
volumes:
  sambhav-data:
